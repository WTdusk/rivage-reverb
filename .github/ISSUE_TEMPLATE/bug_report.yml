name: Bug report
description: Something in the plug-in or the build does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Audio bugs are much easier to
        reproduce with the details below.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown at the bottom right of the editor.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      description: DAW name and version, or "standalone".
      placeholder: "REAPER 7.22"
    validations:
      required: true
  - type: dropdown
    id: machine
    attributes:
      label: Machine (algorithm)
      options:
        - ROOM
        - PLATE
        - HALL
        - SPRING
        - SHIMMER
        - CLOUD
        - Switching between machines
        - Not specific to one machine
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Sample rate and buffer size
      placeholder: "48 kHz / 128 samples"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the plug-in on a guitar track
        2. Select HALL, Decay 60, Mix 40
        3. Play a low A
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Audio clips, screen recordings, `%APPDATA%` logs, or the CPU/OS details.
    validations:
      required: false
