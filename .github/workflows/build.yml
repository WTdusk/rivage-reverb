name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch, so eleven pushes cannot queue eleven ten-minute Windows
# jobs. Only pull-request runs are cancelled when superseded: a cancelled run on
# the default branch makes the README badge read "failing" until the next run
# finishes, and pushes to main are rare enough to let them finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows x64 VST3
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -A x64
          -DRIVAGE_FETCH_JUCE=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build plug-in
        run: cmake --build build --config Release --target RivageReverb_VST3

      - name: Build tools
        run: >
          cmake --build build --config Release
          --target Analyzer RivagePreview

      - name: Smoke test
        shell: bash
        run: bash scripts/smoke.sh

      - name: DSP regression checks
        shell: pwsh
        run: '& "build/tools/analyzer/Analyzer_artefacts/Release/Analyzer.exe" dspcheck'

      - name: VST3 channel layout checks
        shell: pwsh
        run: '& "build/tools/analyzer/Analyzer_artefacts/Release/Analyzer.exe" layouttest "build/Source/RivageReverb_artefacts/Release/VST3/Rivage Reverb.vst3"'

      - name: Freeze behavior checks
        shell: pwsh
        run: '& "build/tools/analyzer/Analyzer_artefacts/Release/Analyzer.exe" freezecheck'

      - name: Cloud parameter range checks
        shell: pwsh
        run: '& "build/tools/analyzer/Analyzer_artefacts/Release/Analyzer.exe" cloudcheck'

      - name: Upload plug-in
        uses: actions/upload-artifact@v4
        with:
          name: Rivage-Reverb-vst3-windows-x64
          path: build/Source/RivageReverb_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 14
